[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-for-business"
version = "0.1.0"
description = "Policy-compliant e-commerce customer-service Agent post-training"
requires-python = ">=3.12,<3.14"
dependencies = [
    "tau2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]
training = [
    "datasets>=3.2",
    "peft>=0.14",
    "torch>=2.4",
    "transformers>=4.51",
    "trl>=0.15",
]

[tool.uv.sources]
tau2 = { path = "vendor/tau2-bench" }

[tool.hatch.build.targets.wheel]
packages = ["src/agent_for_business"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
